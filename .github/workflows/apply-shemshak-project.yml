name: Apply Shemshak residential project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-shemshak-project.yml

permissions:
  contents: write

concurrency:
  group: apply-shemshak-project
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract project images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          bundle = Path('tmp/shemshak_project_bundle')
          parts = sorted(bundle.glob('tiny*.txt'))
          if not parts:
              raise SystemExit('Project image bundle parts were not found.')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          encoded += '=' * (-len(encoded) % 4)
          data = base64.b64decode(encoded, validate=False)
          out = bundle / 'images.zip'
          out.write_bytes(data)
          print(f'Rebuilt {out} from {len(parts)} parts ({len(data)} bytes).')
          PY

          ZIP=tmp/shemshak_project_bundle/images.zip
          if ! unzip -t "$ZIP"; then
            echo "Primary ZIP validation failed; attempting recovery."
            zip -FF "$ZIP" --out tmp/shemshak_project_bundle/images-repaired.zip
            ZIP=tmp/shemshak_project_bundle/images-repaired.zip
            unzip -t "$ZIP"
          fi

          mkdir -p assets/projects/shemshak-residential-7-storey
          unzip -o "$ZIP" -d assets/projects/shemshak-residential-7-storey
          find assets/projects/shemshak-residential-7-storey -maxdepth 1 -type f -print

      - name: Apply project metadata and gallery changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_shemshak_project.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Rebuild and extract the selected, web-optimised project images.')
          end = text.index('# Add the design category and a visible caption overlay to the project gallery.')
          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_shemshak_project.py

      - name: Commit final website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Shemshak structural design project"
          git push
