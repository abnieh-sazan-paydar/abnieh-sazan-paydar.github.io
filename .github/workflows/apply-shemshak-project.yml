name: Apply Shemshak residential project

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-shemshak-project.yml

permissions:
  contents: write

concurrency:
  group: apply-shemshak-project
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply project update
        run: python scripts/apply_shemshak_project.py

      - name: Commit final website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Shemshak structural design project"
          git push
