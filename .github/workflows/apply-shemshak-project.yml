name: Apply Shemshak residential project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-shemshak-project.yml

permissions:
  contents: write

concurrency:
  group: apply-shemshak-project
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply project update
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_shemshak_project.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import hashlib\n', '')
          text = text.replace('expected_sha256 = "b7a1ee2c12290c9dd1b3f0178f1524c18043e3bc280280f8f3950395bc78e924"\nif hashlib.sha256(zip_bytes).hexdigest() != expected_sha256:\n    raise SystemExit("Project image bundle checksum mismatch.")\n', '')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_shemshak_project.py

      - name: Commit final website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Shemshak structural design project"
          git push
